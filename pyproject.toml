[project]
name = "tf2-icons"
version = "0.1.0"
description = "Generate TF2 killicon sprite sheets from VPK files"
requires-python = ">=3.10"
dependencies = [
    "vpk>=1.4.0",
    "srctools>=2.3.0",
    "Pillow>=10.0.0",
]

[project.scripts]
tf2-icons = "generate:main"
tf2-backpack = "backpack:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["generate", "backpack"]
